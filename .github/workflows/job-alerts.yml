name: Buscar vagas e enviar fila Gmail
on:
  workflow_dispatch:
    inputs:
      search:
        description: Buscar novas vagas além de enviar os e-mails pendentes
        type: boolean
        default: true
  schedule:
    # Segunda a sexta-feira, às 9h17 no horário de Brasília.
    - cron: '17 9 * * 1-5'
      timezone: America/Sao_Paulo
permissions:
  contents: read
concurrency:
  group: job-alerts
  cancel-in-progress: false
jobs:
  send-jobs:
    # Ative após a migração. O runner guarda consumo e deduplicação no Neon.
    if: vars.CLOUD_ALERTS_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Consultar fontes e enviar alertas com estado no Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SEND_TELEGRAM: ${{ vars.SEND_TELEGRAM || 'true' }}
          SEND_EMAIL: ${{ vars.SEND_EMAIL || 'true' }}
          EMAIL_PROVIDER: smtp
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          GEMINI_ENABLED: ${{ vars.GEMINI_ENABLED || 'false' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
          GEMINI_SEARCH_MODEL: ${{ vars.GEMINI_SEARCH_MODEL }}
          # Alternativas automáticas e assistência limitada, sem ativar faturamento.
          AUTO_SOURCE_ROUTING: ${{ vars.AUTO_SOURCE_ROUTING || 'true' }}
          GEMINI_AUTO_FALLBACK: ${{ vars.GEMINI_AUTO_FALLBACK || 'false' }}
          GEMINI_AUTO_MODEL: ${{ vars.GEMINI_AUTO_MODEL || 'gemini-3.1-flash-lite' }}
          GEMINI_AUTO_SEARCH_MODEL: ${{ vars.GEMINI_AUTO_SEARCH_MODEL }}
          GEMINI_USER_DAILY_LIMIT: ${{ vars.GEMINI_USER_DAILY_LIMIT || '2' }}
          GEMINI_GLOBAL_DAILY_LIMIT: ${{ vars.GEMINI_GLOBAL_DAILY_LIMIT || '6' }}
          GEMINI_MONTHLY_LIMIT: ${{ vars.GEMINI_MONTHLY_LIMIT || '60' }}
          GEMINI_DAILY_TOKEN_BUDGET: ${{ vars.GEMINI_DAILY_TOKEN_BUDGET || '100000' }}
          JOOBLE_KEYS_JSON: ${{ secrets.JOOBLE_KEYS_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HUNTER_CONFIG_ENV_PRIORITY: 'true'
          SERPAPI_DAILY_LIMIT: ${{ vars.SERPAPI_DAILY_LIMIT || '3' }}
          SERPAPI_MONTHLY_LIMIT: ${{ vars.SERPAPI_MONTHLY_LIMIT || '250' }}
          JOB_KEYWORDS: ${{ vars.JOB_KEYWORDS || 'product engineer;production engineer;engenheiro de produto' }}
          JOB_PROFILE: ${{ vars.JOB_PROFILE || 'both' }}
          MIN_SALARY_BRL: ${{ vars.MIN_SALARY_BRL || '7000' }}
          JOB_COUNTRY: ${{ vars.JOB_COUNTRY || 'BR' }}
          JOB_LOCATION: ${{ vars.JOB_LOCATION }}
          MAX_JOBS: ${{ vars.MAX_JOBS || '100' }}
          WEB_MAX_MARKET_QUERIES: ${{ vars.WEB_MAX_MARKET_QUERIES || '6' }}
          RUN_SEARCH: ${{ (github.event_name == 'workflow_dispatch' && inputs.search) || github.event.schedule == '17 9 * * 1-5' }}
        run: |
          if [ "$RUN_SEARCH" = 'true' ]; then
            python scripts/cloud_alerts.py --search
          else
            python scripts/cloud_alerts.py
          fi
