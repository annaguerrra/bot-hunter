name: Validar aplicação e PostgreSQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: senha-ficticia-somente-testes
          POSTGRES_DB: hunter_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qa -d hunter_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Testes sem credenciais reais
        run: python -m unittest discover -s tests -v
      - name: Migração e contratos PostgreSQL em banco descartável
        env:
          HUNTER_TEST_DATABASE_URL: postgresql://qa:senha-ficticia-somente-testes@localhost:5432/hunter_test
        run: python scripts/check_postgres.py
      - name: Sintaxe da interface
        run: |
          node --check static/app.js
          node --check static/onboarding.js
