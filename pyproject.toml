# Entrada explícita da interface; main.py continua sendo o bot de linha de comando.
[project]
name = "job-hunter-bot"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# Mesmas dependências de requirements.txt; o teste de deploy evita divergências.
dependencies = [
  "requests>=2.32,<3",
  "python-dotenv>=1.0,<2",
  "Flask>=3.1,<4",
  "beautifulsoup4>=4.12,<5",
  "pycountry>=24.6,<27",
  "psycopg[binary]>=3.2,<4",
  "waitress>=3.0,<4",
  "tzdata>=2025.2",
  "PyYAML>=6.0,<7",
]

# O Vercel executa os módulos diretamente; não precisa criar um pacote instalável.
[tool.uv]
package = false

[tool.vercel]
entrypoint = "app:app"
